<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quiz Clock</title>
    <style>
        .clock {
            width: 80%;
            text-align: center;
            background-color: #000000;
            color: #FFFFFF;
            font-size: 256px;
            margin-left: auto;
            margin-right: auto;
        }
        .endtime {
            width: 80%;
            text-align: center;
            background-color: #000000;
            color: #FF7F00;
            font-size: 64px;
            margin-left: auto;
            margin-right: auto;
        }
        .date {
            width: 80%;
            text-align: center;
            background-color: #000000;
            color: #FFFFFF;
            font-size: 64px;
            margin-left: auto;
            margin-right: auto;
        }
        .notes {
            width: 80%;
            text-align: center;
            background-color: #000000;
            color: #FFFFFF;
            font-size: 32px;
            margin-left: auto;
            margin-right: auto;
        }


    </style>
</head>
<body id="body" style="font-family:sans-serif;font-size:15px;width:100%;margin-left:auto;margin-right:auto;background-color:#000000;text-align:center">
	<input id="endinput" type="time" onchange="updateEnd();"></br></br>
	<div id="clock" class="clock"> 00:00 </div></br></br>
	<div id="date" class="date"> </div></br></br></br>
	<div id="endtime" class="endtime"> End Time: 10:25 </div></br></br></br>
	<div id="notes" class="notes"> Screen Color </br> <span style="background-color: #7F7F00"> Under 15 Min </span>&nbsp;&nbsp; <span style="background-color: #FFFF00;color:#000000"> Under 5 Min </span> &nbsp;&nbsp;<span style="background-color: #ff0000"> Under 1 Min </span> </div>
	<script type="text/javascript" >
		let g_EndTimeMin = null;
		let g_EndTimeDate = new Date();
		function dateToDisplayableTime(date)
		{
			const am_pm = date.getHours() >= 12;
			const hoursDisplay = (date.getHours() % 12) > 0 ? (date.getHours() % 12) : 12;
			const minutesDisplay = (date.getMinutes() >= 10) ? date.getMinutes() : "0" + date.getMinutes();
			return hoursDisplay + ":" + minutesDisplay + " " + (am_pm ? "pm" : "am");
		}
		function updateEnd()
		{
			let elem = document.getElementById("endinput");
			let today = new Date();
			g_EndTimeDate = new Date((today.getMonth() + 1) + "/" + today.getDay() + "/" + today.getYear() + " " + elem.value);
			g_EndTimeMin = g_EndTimeDate.getHours() * 60 + g_EndTimeDate.getMinutes();
			let elemEndTimeDisplay = document.getElementById("endtime");
			elemEndTimeDisplay.innerHTML = dateToDisplayableTime(g_EndTimeDate);
		}
//		let g_test = 600;
		let g_TimeStep = 500.0;
		let g_On = true;
		function updateTime()
		{
			let date = new Date();
			
			if (g_EndTimeMin == null) // set initial end time
			{
				g_EndTimeDate = new Date();
				g_EndTimeDate.setHours(g_EndTimeDate.getHours() + 2);
				let minRound = Math.round(date.getMinutes() / 15)
				g_EndTimeDate.setMinutes(minRound * 15);
				g_EndTimeMin = g_EndTimeDate.getHours() * 60 + g_EndTimeDate.getMinutes();
				let elemEndTimeDisplay = document.getElementById("endtime");
				elemEndTimeDisplay.innerHTML = "End Time: " + dateToDisplayableTime(g_EndTimeDate);
			}
			
			const minutes_ref = date.getHours() * 60 + date.getMinutes();
			document.getElementById("clock").innerHTML = dateToDisplayableTime(date);
			
			const timeRemainingMinutes = g_EndTimeMin - minutes_ref;
			let elem_body = document.getElementById("body");
			if (timeRemainingMinutes <= 0)
			{
				g_TimeStep = 100;
				g_On = g_On ? false : true;
				if (g_On)
					elem_body.style.backgroundColor = "#ff0000";
				else
					elem_body.style.backgroundColor = "#ffff00";
			}
			else if (timeRemainingMinutes <= 1)
				elem_body.style.backgroundColor = "#ff0000";
			else if (timeRemainingMinutes <= 5)
				elem_body.style.backgroundColor = "#ffff00";
			else if (timeRemainingMinutes <= 15)
				elem_body.style.backgroundColor = "#7f7f00";
			else
				elem_body.style.backgroundColor = "#000000";
			

			document.getElementById("date").innerHTML = (date.getMonth() + 1) + "/" + date.getDate() + "/" + date.getFullYear();

			window.setTimeout(updateTime, g_TimeStep);
			
		}
		updateTime();
	</script>
</body>
</html>
